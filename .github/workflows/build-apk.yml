name: "Build apk"
on: push

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
            - run: flutter build apk --split-per-abi --android-skip-build-dependency-validation
            - run: gh release create latest build/app/outputs/flutter-apk/*.apk
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
